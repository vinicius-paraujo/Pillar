prefix: "<gray>[<gold>Pillar</gold>]</gray> "

fleet:
  header: "<gold>Fleet <gray>(<count> nodes)</gray>"
  entry: "<gray>- <white><name></white> (<role>) <dark_gray>·</dark_gray> <white><status></white></gray>"
  empty: "<gray>No nodes registered.</gray>"

ping:
  success: "<green>Pong from <white><server></white> in <white><latency>ms</white>.</green>"
  timeout: "<red>No response from <white><server></white> (timed out).</red>"
  failed: "<red>Request to <white><server></white> failed: <message></red>"
  unknown_server: "<red>Unknown server: <white><server></white>.</red>"
  self: "<red>Cannot ping the node you are running this command on.</red>"

connection:
  degraded: "<red>Redis connection lost. Running in degraded mode.</red>"
  restored: "<green>Redis connection restored.</green>"

command:
  usage: "<gold>Pillar</gold><br><gray>  /pillar fleet</gray> <white>- Lists all nodes in the network.</white><br><gray>  /pillar status</gray> <white>- Shows node health and recent logs.</white><br><gray>  /pillar ping <server></gray> <white>- Measures latency to a node.</white><br><gray>  /pillar reload</gray> <white>- Reloads configs and languages.</white>"
  reloaded: "<green>Configuration and language reloaded.</green>"

status:
  connection: "<gray>Connection: <white><state></white></gray>"
  pending: "<gray>Pending inbox entries: <white><count></white></gray>"
  log_header: "<gray>Recent activity:</gray>"
  log_entry: "<dark_gray>-</dark_gray> <white><level></white> <gray><message></gray>"
  log_empty: "<gray>No recent activity.</gray>"

routing:
  no-eligible-node: "<red>There are no servers available right now. Please try again later.</red>"
  unroutable: "<red>Target server is not recognized by the proxy.</red>"
