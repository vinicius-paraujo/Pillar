prefix: "<gray>[<gold>Pillar</gold>]</gray> "

fleet:
  header: "<gold>Fleet <gray>(<count> nodes)</gray>"
  entry: "<gray>- <white><name></white> (<role>) <dark_gray>·</dark_gray> <white><status></white></gray>"
  empty: "<gray>No nodes registered.</gray>"

ping:
  success: "<green>Pong from <white><server></white> in <white><latency>ms</white>.</green>"
  timeout: "<red>No response from <white><server></white> (timed out).</red>"
  publish_failed: "<red>Could not reach Redis to send ping to <white><server></white>.</red>"
  failed: "<red>Request to <white><server></white> failed: <message></red>"
  unknown_server: "<red>Unknown server: <white><server></white>.</red>"
  self: "<red>Cannot ping the node you are running this command on.</red>"

connection:
  degraded: "<red>Redis connection lost. Running in degraded mode.</red>"
  restored: "<green>Redis connection restored.</green>"

command:
  usage: "<gold>Pillar</gold><br><gray>  /pillar fleet</gray> <white>- Lists all nodes in the network.</white><br><gray>  /pillar status</gray> <white>- Shows node health and recent logs.</white><br><gray>  /pillar doctor</gray> <white>- Shows advanced internal diagnostic data.</white><br><gray>  /pillar ping <server></gray> <white>- Measures latency to a node.</white><br><gray>  /pillar reload [role]</gray> <white>- Reloads configs and languages locally or across a fleet role.</white>"
  reloaded: "<green>Configuration and language reloaded locally.</green>"

reload:
  no_targets: "<red>No online nodes found with role '<white><role></white>'.</red>"
  dispatching: "<yellow>Dispatching reload signal to <white><count></white> nodes...</yellow>"
  success: "<gray>[<white><server></white>] <green>Reload successful.</green></gray>"
  failed: "<gray>[<white><server></white>] <red>Reload failed: <message></red></gray>"
  summary: "<green>Reload complete: <white><success></white> succeeded, <white><failures></white> failed.</green>"

status:
  connection: "<gray>Connection: <white><state></white></gray>"
  pending: "<gray>Pending inbox entries: <white><count></white></gray>"
  log_header: "<gray>Recent activity:</gray>"
  log_entry: "<dark_gray>-</dark_gray> <white><level></white> <gray><message></gray>"
  log_empty: "<gray>No recent activity.</gray>"

routing:
  no-eligible-node: "<red>There are no servers available right now. Please try again later.</red>"
  unroutable: "<red>Target server is not recognized by the proxy.</red>"

doctor:
  header: "<gold>Doctor Report</gold>"
  connection: "<gray>Connection: <white><state></white> (for <duration>)</gray>"
  transport: "<gray>Transport:</gray> <white><pending></white> pending, <white><dead_letters></white> dead-letters, <white><dispatch_queue></white> queued, <white><reaps></white> reaps"
  transport_paper: "<gray>Transport:</gray> <white><pending></white> pending, <white><dead_letters></white> dead-letters, <white><dispatch_queue></white> queued"
  health: "<gray>Health:</gray> <white><missing></white> missing snapshots, oldest is <white><oldest_age></white> old"
  decisions_header: "<gray>Recent Decisions:</gray>"
  decisions_empty: "<gray>  No recent decisions.</gray>"
  decision_success: "<gray>  - <green>SUCCESS</green>: <role> -> <node></gray>"
  decision_refused: "<gray>  - <red>REFUSED</red>: <role> (<reason>)</gray>"
