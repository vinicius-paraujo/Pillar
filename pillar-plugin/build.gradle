plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.4.3'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = uri('https://repo.papermc.io/repository/maven-public/')
    }
}

dependencies {
    implementation project(':pillar-api')

    compileOnly 'io.papermc.paper:paper-api:26.1.2.build.+'
    compileOnly 'com.velocitypowered:velocity-api:3.4.0'

    implementation('redis.clients:jedis:5.2.0') {
        exclude group: 'org.slf4j'
        exclude group: 'com.google.errorprone'
    }
    // Declared even though Jedis already brings it: the wire codec deserializes through
    // Gson, so leaving the version to a transitive edge means a Jedis patch bump can change
    // deserialization behavior with nothing here to show it. Record payloads also need
    // 2.10 or newer, since older Gson fails hard on setAccessible against a record.
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.yaml:snakeyaml:2.3'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers:1.20.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

version = rootProject.version

base {
    archivesName = 'pillar'
}

processResources {
    inputs.property 'version', project.version
    // Plain token replacement rather than expand(): the descriptor's ASCII banner contains
    // backslashes that Groovy's template engine would try to interpret.
    filesMatching(['plugin.yml', 'velocity-plugin.json']) {
        filter { line -> line.replace('${version}', project.version.toString()) }
    }
}

jar {
    enabled = false
}

shadowJar {
    archiveClassifier = ''
    mergeServiceFiles()
    exclude 'META-INF/maven/**'

    relocate 'redis.clients', 'br.com.markineo.pillar.lib.jedis'
    relocate 'org.apache.commons.pool2', 'br.com.markineo.pillar.lib.pool2'
    relocate 'com.google.gson', 'br.com.markineo.pillar.lib.gson'
    relocate 'org.json', 'br.com.markineo.pillar.lib.json'
    relocate 'org.yaml.snakeyaml', 'br.com.markineo.pillar.lib.snakeyaml'
}

build.dependsOn shadowJar
